<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Тестирование Altcraft Pixel</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 24px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            color: #172033;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(99, 102, 241, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(139, 92, 246, 0.16),
                    transparent 35%
                ),
                #f8fafc;
        }

        .card {
            width: 100%;
            max-width: 560px;

            padding: 45px 40px;

            text-align: center;

            background: rgba(255, 255, 255, 0.9);

            border: 1px solid #e5e7eb;
            border-radius: 24px;

            box-shadow:
                0 20px 60px rgba(15, 23, 42, 0.1);
        }

        .icon {
            width: 72px;
            height: 72px;

            display: flex;
            align-items: center;
            justify-content: center;

            margin: 0 auto 22px;

            border-radius: 20px;

            font-size: 34px;

            background: linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

            box-shadow:
                0 12px 28px rgba(99, 102, 241, 0.25);
        }

        .badge {
            display: inline-block;

            margin-bottom: 16px;

            padding: 7px 13px;

            border-radius: 999px;

            color: #4f46e5;
            background: #eef2ff;

            font-size: 12px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        h1 {
            margin: 0 0 15px;

            color: #111827;

            font-size: 32px;
            line-height: 1.2;
            letter-spacing: -0.03em;
        }

        .description {
            margin: 0 auto 28px;

            max-width: 450px;

            color: #64748b;

            font-size: 16px;
            line-height: 1.7;
        }

        .status {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 10px;

            margin: 25px 0;

            padding: 14px 18px;

            border-radius: 14px;

            background: #f0fdf4;

            color: #166534;

            font-size: 14px;
            font-weight: 600;
        }

        .status-dot {
            width: 9px;
            height: 9px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow:
                0 0 0 4px rgba(34, 197, 94, 0.12);
        }

        .button {
            display: inline-block;

            padding: 15px 25px;

            border: 0;
            border-radius: 14px;

            color: white;

            background: linear-gradient(
                135deg,
                #6366f1,
                #7c3aed
            );

            font-size: 15px;
            font-weight: 700;

            text-decoration: none;

            cursor: pointer;

            box-shadow:
                0 10px 22px rgba(99, 102, 241, 0.25);

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 14px 28px rgba(99, 102, 241, 0.32);
        }

        .button:active {
            transform: translateY(0);
        }

        .footer {
            margin-top: 30px;

            color: #94a3b8;

            font-size: 12px;
            line-height: 1.5;
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 35px 22px;
                border-radius: 20px;
            }

            h1 {
                font-size: 28px;
            }

            .description {
                font-size: 15px;
            }
        }
    </style>


    <!-- ===================================================== -->
    <!-- START OF ALTCRAFT PIXEL CODE -->
    <!-- ===================================================== -->

    <script type="text/javascript">
        !function(){
            var e={
                url:"https://pxl.demo.altcraft.com/pixel?k=4jtMs0znxJBtIOxAxAubGED5PnuCQXaubmjAHAFAb41axZT5IQLfp91HVEW46hhg&s=%2Fq9L%2FH5JJ5A%3D",
                goals:"",
                value:parseFloat("0"),
                timeout:parseInt("5000"),
                after_scroll:JSON.parse("false"),
                auto_load:JSON.parse("true")
            },
            o=function(o,t,n,a){
                var d=[].concat(o)
                    .map(function(e){
                        return encodeURIComponent(e)
                    })
                    .join(","),

                    c=encodeURIComponent(String(t||0)),
                    i=encodeURIComponent(n.matching_mode||""),
                    r=encodeURIComponent(n.db_id||0),
                    u=encodeURIComponent(JSON.stringify(n.match||{})),
                    l=encodeURIComponent(JSON.stringify(n.update||{}));

                setTimeout(function(){
                    (new Image).src=[
                        e.url,
                        "goals="+d,
                        "value="+c,
                        "db_id="+r,
                        "mmode="+i,
                        "match="+u,
                        "update="+l
                    ].join("&")
                },a)
            },
            t=!1,

            n=function(){
                t||(t=!0,

                e.after_scroll
                    ? document.addEventListener(
                        "scroll",
                        function(){
                            (window.pageYOffset ||
                            document.documentElement.scrollTop>0)
                            &&
                            o(e.goals,e.value,{},e.timeout)
                        },
                        {once:true}
                    )

                    : e.auto_load &&
                        o(e.goals,e.value,{},e.timeout)
                )
            };

            "complete"===document.readyState ||
            "interactive"===document.readyState
                ? n()
                : window.addEventListener("load",n);

            window.ak_pixel_push=function(e,t,n,a,d,c){
                var i=[];

                Array.isArray(e)
                    ? i=e
                    : i[0]=e;

                o(
                    i,
                    t,
                    {
                        match:n,
                        update:a,
                        matching_mode:d,
                        db_id:c
                    },
                    0
                )
            }
        }();
    </script>

    <!-- ===================================================== -->
    <!-- END OF ALTCRAFT PIXEL CODE -->
    <!-- ===================================================== -->

</head>


<body>

    <main class="card">

        <div class="icon">
            📊
        </div>

        <div class="badge">
            Altcraft Pixel
        </div>

        <h1>
            Страница тестирования
        </h1>

        <p class="description">
            Эта страница используется для проверки работы
            браузерного пикселя Altcraft и отслеживания
            посещений.
        </p>

        <div class="status">
            <span class="status-dot"></span>
            <span>Пиксель установлен и загружен</span>
        </div>

        <button
            class="button"
            type="button"
            onclick="alert('Событие отправлено')"
        >
            Тестировать событие
        </button>

        <div class="footer">
            Тестовая страница · Altcraft Pixel
        </div>

    </main>

</body>
</html>
